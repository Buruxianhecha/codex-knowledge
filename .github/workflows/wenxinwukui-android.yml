name: Build 问薪无愧 Android (固定签名)
on:
  push:
    branches:
      - master
      - feature/wenxinwukui-android-20261014
    paths:
      - standalone-apps/wenxinwukui/**
      - .github/workflows/wenxinwukui-android.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKROOT="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore web app PNG icons
        shell: bash
        run: |
          shopt -s nullglob
          for f in standalone-apps/wenxinwukui/android/app/src/main/assets/icons/*.png.b64; do
            base64 --decode "$f" > "${f%.b64}"
          done
      - name: Require fixed signing key (no ephemeral debug fallback)
        shell: bash
        env:
          WENXIN_KEYSTORE_BASE64: ${{ secrets.WENXIN_KEYSTORE_BASE64 }}
          WENXIN_SIGNING_PASSWORD: ${{ secrets.WENXIN_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$WENXIN_KEYSTORE_BASE64" || -z "$WENXIN_SIGNING_PASSWORD" ]]; then
            echo '::error::Missing fixed Android signing secrets: WENXIN_KEYSTORE_BASE64 and/or WENXIN_SIGNING_PASSWORD. See android/SIGNING.md.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/wenxin-signing"
          printf '%s' "$WENXIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wenxin-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/wenxin-signing/release.p12"
          echo "WENXIN_KEYSTORE_PATH=$RUNNER_TEMP/wenxin-signing/release.p12" >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        working-directory: standalone-apps/wenxinwukui/android
        env:
          WENXIN_SIGNING_PASSWORD: ${{ secrets.WENXIN_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify APK certificate fingerprint, version and assets
        shell: bash
        run: |
          APK="standalone-apps/wenxinwukui/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --verbose "$APK"
          CERT_INFO="$($SIGNER verify --print-certs "$APK")"
          ACTUAL="$(printf '%s\n' "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:lower:]' '[:upper:]' | tr -d '\r\n: ')"
          EXPECTED="$(tr -d '\r\n: ' < standalone-apps/wenxinwukui/android/signing/expected-cert-sha256.txt)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo '::error::Signing certificate changed; refusing to distribute APK'
            exit 1
          fi
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.wenxinwukui.ledger' versionCode='3' versionName='0.1.2-beta'"
          unzip -l "$APK" | grep -Fq 'assets/index.html'
          unzip -l "$APK" | grep -Fq 'classes.dex'
          unzip -p "$APK" assets/index.html | grep -Fq '日常账本'
          if unzip -p "$APK" assets/index.html | grep -Fq '<section class="mine-card mine-member">'; then
            echo '::error::Deprecated demo membership card still present'
            exit 1
          fi
          cp "$APK" '问薪无愧-v0.1.2-beta.apk'
          echo "Certificate verified: $EXPECTED"
      - uses: actions/upload-artifact@v4
        with:
          name: 问薪无愧-v0.1.2-beta-固定签名APK
          path: 问薪无愧-v0.1.2-beta.apk
          if-no-files-found: error
          retention-days: 30
